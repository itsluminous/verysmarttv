# VerySmartTV version catalog: the one place every module's dependency versions live.
#
# Versions are pinned; Dependabot (.github/dependabot.yml) proposes bumps. Alphabetical inside each
# table, one line per entry, a comment where the choice was not obvious. A library joins this file
# in the phase that first uses it (DESIGN.md §20), not before.

[versions]
# --- build tooling -----------------------------------------------------------
agp = "9.5.1"                # Android Gradle Plugin; the version HikViewer pins (DESIGN.md §5.1). Needs Gradle >= 9.6 and build-tools 36.

# --- libraries ---------------------------------------------------------------
androidxAnnotation = "1.9.1"  # @NonNull/@Nullable on :core's public API (lint UnknownNullness); compile-time only, R8 strips it
androidxDynamicanimation = "1.0.0"  # the launcher's spring animations (carried from the fork; the only release of the library)
androidxRecyclerview = "1.3.2"      # the launcher grid and traktshelf's poster rows (carried)

# --- test libraries ----------------------------------------------------------
junit4 = "4.13.2"            # the carried launcher tests are JUnit 4 (ADR-019)
robolectric = "4.17"         # @Config(sdk = 34) view and ContentProvider tests (DESIGN.md §14.1)
androidxTestCore = "1.6.1"   # ActivityScenario for the instrumentation smoke (DESIGN.md §14.3)
androidxTestEspresso = "3.6.1"  # Espresso view assertions on the emulator
androidxTestJunit = "1.2.1"  # AndroidJUnit4 runner class
androidxTestRunner = "1.6.2" # AndroidJUnitRunner, the testInstrumentationRunner every module sets
androidxTestUiautomator = "2.4.1"  # the install-and-Home smoke that spans apps (HOME key, mFocusedApp)

[libraries]
# --- build-logic only (the included build resolves these on its own classpath) ---
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }

# --- androidx ----------------------------------------------------------------
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
androidx-dynamicanimation = { module = "androidx.dynamicanimation:dynamicanimation", version.ref = "androidxDynamicanimation" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidxRecyclerview" }

# --- test ------------------------------------------------------------------------
junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidxTestUiautomator" }

[bundles]
jvm-test = ["junit4", "robolectric"]
android-test = ["junit4", "androidx-test-core", "androidx-test-espresso-core", "androidx-test-junit", "androidx-test-runner", "androidx-test-uiautomator"]
