# Continuous integration for VerySmartTV (DESIGN.md §15.1).
#
#   verify       - every gate behind `./gradlew ci`: unit tests, Android Lint, build-logic tests, fileLength.
#   build        - debug + release APKs of every module (release is debug-signed here; real signing is
#                  release.yml's job on tags) and the launcher APK size gate.
#   changes      - whether a pull request touched code the emulator suites could catch.
#   instrumented - Espresso on an Android TV emulator. Runs on pushes to main, on demand, and on pull
#                  requests that changed code, Gradle files or these workflows (ADR-022).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  verify:
    name: Tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run quality gates
        run: ./gradlew ci --stacktrace

      # The old identifiers may live only in the licence, the notices, the README's credits, the design
      # and the preset headers (ADR-010; the command is docs/BUILDING.md, "Identifier gate"). This file
      # is left out because it holds the pattern. Phase 5 moves the check into tests/; until then the
      # carry phases need it here.
      - name: Identifier gate
        run: |
          set -uo pipefail
          hits=$(git grep -niE 'leantv|gathin|tvhome|cleanyourtv' -- ':!LICENSE' ':!THIRD_PARTY_NOTICES.md' ':!README.md' ':!docs/' ':!presets/' ':!.github/workflows/ci.yml' || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::old identifiers outside the allowed files (docs/BUILDING.md, Identifier gate)"
            exit 1
          fi
          echo "identifier gate: nothing found"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            */build/reports/tests/
            */build/test-results/
            build-logic/build/reports/tests/
            build-logic/build/test-results/
          if-no-files-found: ignore

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: |
            */build/reports/lint-results-*
          if-no-files-found: ignore

  build:
    name: Build APKs
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Assemble debug and release
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      # ADR-031: the launcher must stay installable on 1 GB TVs. The gate applies as soon as the
      # :launcher module exists in the tree (Phase 1); until then there is nothing to measure.
      - name: Launcher APK size gate (900 KB)
        run: |
          set -euo pipefail
          limit=921600
          if [ ! -d launcher ]; then
            echo "no launcher/ module yet; size gate not applicable"
            exit 0
          fi
          apk=$(find launcher/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          test -n "$apk" || { echo "::error::no launcher release APK was produced"; exit 1; }
          size=$(stat -c %s "$apk")
          echo "launcher release APK: $size bytes ($apk)"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::launcher APK is $size bytes, over the $limit byte gate (ADR-031)"
            exit 1
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            */build/outputs/apk/debug/*.apk
            */build/outputs/apk/release/*.apk
          if-no-files-found: ignore

  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      androidtest: ${{ steps.androidtest.outputs.present }}
    steps:
      - uses: actions/checkout@v7

      # Whether any module has instrumentation sources yet (none in Phases 0 and 1).
      - id: androidtest
        run: |
          if find . -path '*/src/androidTest/*' -type f -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'core/**'
              - 'testkit/**'
              - 'launcher/**'
              - 'traktshelf/**'
              - 'livescore/**'
              - 'build-logic/**'
              - 'config/**'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - '*.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/**'

  instrumented:
    name: Espresso on the Android TV emulator
    needs: [verify, changes]
    # Always on main and on demand; on a pull request only when the filter saw code, build or workflow
    # changes (a dependency bump counts: those break at runtime more often than in unit tests).
    # Skipped entirely while no module has androidTest sources (Phases 0 and 1): booting an emulator
    # for an empty suite tells nobody anything.
    if: |
      needs.changes.outputs.androidtest == 'true'
      && (github.event_name == 'workflow_dispatch'
        || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        || (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Google ships the API 34 Android TV image for x86 (32-bit) and arm64 only (DESIGN.md §14.3).
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 1536M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -camera-back none
          # The emulator is slow to settle after boot: SystemUI or the setup wizard can still be busy
          # and throw an "isn't responding" dialog over the app, after which Espresso waits forever
          # for the app window to get focus. Give the device a minute, keep the screen awake, turn
          # the ANR dialogs off, and dismiss anything left on screen before Gradle starts.
          script: |
            adb wait-for-device
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell settings put secure show_ime_with_hard_keyboard 0
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put system screen_off_timeout 2147483647
            adb shell svc power stayon true
            sleep 60
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell input keyevent KEYCODE_HOME
            sleep 10
            adb shell dumpsys window windows | grep -E 'mCurrentFocus|mFocusedApp' || true
            ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: |
            */build/reports/androidTests/
            */build/outputs/androidTest-results/
          if-no-files-found: ignore
