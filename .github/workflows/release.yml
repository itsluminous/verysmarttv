# Release build (DESIGN.md §15.2, §15.3). Triggered by pushing a tag such as `v1.2.3`.
#
# The tag names the build: `v1.2.3` becomes versionName 1.2.3 and versionCode 10203 for all three
# apps (build-logic/src/main/kotlin/AppVersion.kt), and the files verysmarttv-launcher-1.2.3.apk,
# verysmarttv-traktshelf-1.2.3.apk, verysmarttv-livescore-1.2.3.apk, attached to a GitHub release
# with SHA256SUMS and release notes (the annotated tag's message, else GitHub's generated notes
# grouped by .github/release.yml).
#
# Signing is mandatory: the job FAILS when the four signing secrets are missing, and FAILS when an APK
# comes out signed with anything but the release key (a mis-wired secret must never ship a
# debug-signed release). The three API-key secrets are optional: traktshelf builds with empty keys and
# its sign-in screen says so.
#   KEYSTORE_BASE64    `base64 < release.jks`         KEYSTORE_PASSWORD   KEY_ALIAS (verysmarttv)   KEY_PASSWORD
#   TRAKT_CLIENT_ID    TMDB_API_KEY                   OMDB_API_KEY
# The `secrets` context is not available in a step's `if:`, so presence is checked in a shell step.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  APPS: launcher traktshelf livescore

jobs:
  release:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the annotated tag object carries the release notes

      - name: Version from tag
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}(-[0-9A-Za-z.]+)?$'; then
            echo "::error::tag '$GITHUB_REF_NAME' must be vX.Y.Z or vX.Y.Z-suffix with each part below 100"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building VerySmartTV $version from tag $GITHUB_REF_NAME"

      - name: Check the secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          set -euo pipefail
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::release signing secrets missing:$missing. A release is never debug-signed; add them under Settings > Secrets (docs/BUILDING.md, Signing)."
            exit 1
          fi
          for name in TRAKT_CLIENT_ID TMDB_API_KEY OMDB_API_KEY; do
            [ -n "${!name}" ] || echo "::warning::$name is not set: traktshelf is built with an empty key"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Run quality gates
        run: ./gradlew ci --stacktrace

      - name: Assemble signed release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: ./gradlew assembleRelease -PversionName="${{ steps.version.outputs.version }}" --stacktrace

      - name: Collect the three APKs and write checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for app in $APPS; do
            apk="$app/build/outputs/apk/release/verysmarttv-$app-$VERSION.apk"
            if [ ! -f "$apk" ]; then
              echo "::error::expected $apk; every tag publishes all three apps (ADR-023). Found:"
              find . -path '*/build/outputs/apk/release/*.apk' -print || true
              exit 1
            fi
            cp "$apk" dist/
          done
          (cd dist && sha256sum -- *.apk > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Verify every APK is signed with the release key
        id: verify
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME"/build-tools -maxdepth 2 -name apksigner | sort -V | tail -1)
          expected=$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null \
            | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f' || true)
          if [ -z "$expected" ]; then
            echo "::error::could not read the release certificate from the keystore (wrong KEYSTORE_PASSWORD or KEY_ALIAS?)"
            exit 1
          fi
          for app in $APPS; do
            apk="dist/verysmarttv-$app-$VERSION.apk"
            certs=$("$apksigner" verify --print-certs "$apk")
            dn=$(printf '%s\n' "$certs" | sed -n 's/.*certificate DN: //p' | head -1)
            actual=$(printf '%s\n' "$certs" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            if [ "$actual" != "$expected" ]; then
              echo "::error::$apk is signed by '$dn' ($actual), not by the release key ($expected)"
              exit 1
            fi
            echo "$apk: signed with the release key"
          done
          echo "digest=$expected" >> "$GITHUB_OUTPUT"

      # Release notes come from the annotated tag's message (`git tag -a vX.Y.Z -m ...`, ADR-024); a
      # lightweight tag has none, and the release then falls back to GitHub's generated notes grouped by
      # .github/release.yml. Either way the body ends with the signer digest and the install line.
      - name: Compose the release body
        id: notes
        env:
          DIGEST: ${{ steps.verify.outputs.digest }}
        run: |
          set -euo pipefail
          body=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")
          subject=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          footer=$(printf '\n---\nSigner certificate SHA-256: `%s`\nVerify a download: `apksigner verify --print-certs <apk>`; checksums in `SHA256SUMS`.\nInstall with: `setup/setup.sh` (macOS/Linux) or `setup/setup.ps1` (Windows).\n' "$DIGEST")
          if [ -n "$body" ]; then
            printf 'generate=false\n' >> "$GITHUB_OUTPUT"
            { printf 'body<<NOTES_EOF\n'; printf '%s\n\n%s\n%s\n' "$subject" "$body" "$footer"; printf 'NOTES_EOF\n'; } >> "$GITHUB_OUTPUT"
          else
            printf 'generate=true\n' >> "$GITHUB_OUTPUT"
            { printf 'body<<NOTES_EOF\n'; printf '%s\n' "$footer"; printf 'NOTES_EOF\n'; } >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: VerySmartTV ${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}
          append_body: ${{ steps.notes.outputs.generate == 'true' }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/verysmarttv-launcher-${{ steps.version.outputs.version }}.apk
            dist/verysmarttv-traktshelf-${{ steps.version.outputs.version }}.apk
            dist/verysmarttv-livescore-${{ steps.version.outputs.version }}.apk
            dist/SHA256SUMS
